<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Gamecrit</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #videoContainer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        z-index: 10;
      }
      #videoFrame {
        width: 100%;
        height: 100%;
      }
      #closeButton {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 11;
        background-color: red;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
      }
      #loadingOverlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 12;
      }
      .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
</head>
<body>
    <!-- Added proper wrapper class for centering -->
    <div class="main-wrapper">
        <div id="unity-container" class="unity-desktop">
            <canvas id="unity-canvas" width="100%" height="100%" tabindex="-1"></canvas>
            <div id="unity-loading-bar">
                <div id="unity-logo"></div>
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
            <!-- Restructured controls with left, center, right layout -->
            <div id="unity-controls">
                <div class="button-left">
                    <!-- Replaced text with icon image -->
                    <button id="unity-fullscreen-button" class="unity-button">
                        <img src="TemplateData/fullscreen-button.png" alt="Fullscreen">
                    </button>
                </div>
                <div id="app-name">Gamecrit</div>
                <div class="button-right">
                    <!-- Unload button will be added here by JavaScript -->
                </div>
            </div>
            <div id="unity-warning"></div>
        </div>
    </div>

    <!-- Video overlay -->
    <div id="video-overlay">
        <div id="video-container">
            <button id="close-video" onclick="closeVideo()">✕ Close</button>
            <iframe id="video-frame" src="about:blank"></iframe>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        let unityInstance = null;
        let isUnityLoaded = false;

        // Video functionality
        function updateIframe(url) {
            console.log("Loading video:", url);
            
            // Convert YouTube links to embed format
            const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
            if (ytMatch) {
                const videoId = ytMatch[1];
                url = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            }

            document.getElementById("loading-overlay").style.display = 'flex';
            
            if (unityInstance && isUnityLoaded && typeof unityInstance.SetFullscreen === 'function') {
                try {
                    unityInstance.SetFullscreen(0);
                } catch (e) {
                    console.warn("Could not exit fullscreen:", e);
                }
            }

            const iframe = document.getElementById("video-frame");
            iframe.src = url;
            iframe.onload = () => {
                document.getElementById("loading-overlay").style.display = 'none';
                document.getElementById("video-overlay").style.display = 'flex';
            };
        }

        function closeVideo() {
            if (confirm("Are you sure you want to close the video?")) {
                const iframe = document.getElementById("video-frame");
                iframe.src = "about:blank";
                document.getElementById("video-overlay").style.display = 'none';
                document.getElementById("loading-overlay").style.display = 'none';
                iframe.onload = null;
            }
        }

        // Unity banner messages
        function unityShowBanner(msg, type) {
            const warningBanner = document.querySelector("#unity-warning");
            const div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);

            if (type === 'error') {
                div.style = 'background: red; padding: 10px; color: white; margin: 5px 0; border-radius: 4px;';
            } else if (type === 'warning') {
                div.style = 'background: orange; padding: 10px; color: white; margin: 5px 0; border-radius: 4px;';
                setTimeout(() => {
                    if (warningBanner.contains(div)) {
                        warningBanner.removeChild(div);
                    }
                }, 5000);
            }

            warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }

        // Unity configuration
        const canvas = document.querySelector("#unity-canvas");
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/GameCRIT.github.io.loader.js";

        const config = {
            arguments: [],
            dataUrl: buildUrl + "/GameCRIT.github.io.data.br",
            frameworkUrl: buildUrl + "/GameCRIT.github.io.framework.js.br",
            codeUrl: buildUrl + "/GameCRIT.github.io.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Gamecrit",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        // Mobile detection and setup
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
        }

        // Load Unity
        document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          const fullscreenBtn = document.querySelector("#unity-fullscreen-button");
          if (fullscreenBtn) {
            fullscreenBtn.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
          var quit = document.createElement("button");
          quit.style = "margin-left: 5px; background-color: lightgray; border: none; padding: 5px; cursor: pointer";
          quit.innerHTML = "Unload";
          document.querySelector("#unity-build-title").appendChild(quit);
          quit.onclick = () => {
            unityInstance.Quit().then(() => {
              document.querySelector("#unity-container").remove();
              canvas = null;
              script.remove();
              script = null;
            });
          };
        }).catch((message) => {
          alert(message);
        });
      };

        document.body.appendChild(script);
    </script>
</body>
</html>
