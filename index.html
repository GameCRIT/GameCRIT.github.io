<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>GameCRIT</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #webgl-error {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #ff4444;
        color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        z-index: 1000;
        max-width: 500px;
      }
      #webgl-error button {
        background: white;
        color: #ff4444;
        border: none;
        padding: 10px 20px;
        margin: 10px;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">GameCRIT</div>
      </div>
    </div>
    
    <div id="webgl-error">
      <h3>WebGL Error Detected</h3>
      <p id="error-message">Your browser doesn't support WebGL or it's disabled.</p>
      <div>
        <button onclick="location.reload()">Retry</button>
        <button onclick="showWebGLHelp()">Help</button>
        <button onclick="hideError()">Close</button>
      </div>
    </div>

    <script>
      // WebGL compatibility check
      function checkWebGLSupport() {
        try {
          var canvas = document.createElement('canvas');
          var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          return gl !== null && gl !== undefined;
        } catch (e) {
          return false;
        }
      }

      function showWebGLError(message) {
        document.getElementById('error-message').textContent = message;
        document.getElementById('webgl-error').style.display = 'block';
        document.getElementById('unity-container').style.filter = 'blur(5px)';
      }

      function hideError() {
        document.getElementById('webgl-error').style.display = 'none';
        document.getElementById('unity-container').style.filter = 'none';
      }

      function showWebGLHelp() {
        var helpText = "To fix WebGL issues:\n\n" +
                      "1. Update your browser to the latest version\n" +
                      "2. Enable WebGL in browser settings:\n" +
                      "   - Chrome: chrome://flags → Enable WebGL\n" +
                      "   - Firefox: about:config → Set webgl.disabled to false\n" +
                      "3. Enable Hardware Acceleration in browser settings\n" +
                      "4. Update your graphics drivers\n" +
                      "5. Try a different browser";
        alert(helpText);
      }

      // Check WebGL support before loading Unity
      if (!checkWebGLSupport()) {
        showWebGLError("WebGL is not supported or enabled in your browser. Please check your browser settings.");
      }

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 2px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 2px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/GameCRIT.github.io.loader.js";
      var config = {
        dataUrl: buildUrl + "/GameCRIT.github.io.data.unityweb",
        frameworkUrl: buildUrl + "/GameCRIT.github.io.framework.js.unityweb",
        codeUrl: buildUrl + "/GameCRIT.github.io.wasm.unityweb",
        symbolsUrl: buildUrl + "/GameCRIT.github.io.symbols.json.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Gamecrit",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

        unityShowBanner('WebGL builds are not supported on mobile devices.');
      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          console.error('Unity instance creation failed:', message);
          showWebGLError('Failed to start the game: ' + message);
        });
      };
      
      script.onerror = () => {
        console.error('Failed to load Unity loader script');
        showWebGLError('Failed to load game files. Please check your internet connection and try again.');
      };
      
      document.body.appendChild(script);

      // Additional error handling for WebGL context loss
      canvas.addEventListener('webglcontextlost', function(e) {
        console.error('WebGL context lost:', e);
        showWebGLError('WebGL context was lost. This may be due to browser or system issues. Please try refreshing the page.');
        e.preventDefault();
      }, false);

      canvas.addEventListener('webglcontextrestored', function(e) {
        console.log('WebGL context restored:', e);
        hideError();
      }, false);
    </script>
  </body>
</html>
