<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Gamecrit</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        /* Background and layout */
        body {
            background-image: url('Images/bg.png');
            background-repeat: repeat;
            background-size: 500px;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            animation: moveBg 20s linear infinite;
        }

        /* Diagonal background movement animation */
        @keyframes moveBg {
            0% {
                background-position: 0px 0px;
            }
            100% {
                background-position: 500px 500px;
            }
        }

        /* Added main wrapper styling for proper centering */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Unity container */
        #unity-container {
            border: 2px solid white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            width: fit-content;
            background: #000;
        }

        /* Redesigned control bar to spread elements across left, center, right */
        #unity-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Fixed button styling to apply to both buttons properly */
        .unity-button,
        #unity-fullscreen-button,
        #unity-quit-button {
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            font-weight: normal;
            transition: opacity 0.2s ease;
            color: white;
            background: transparent;
            display: inline-block; /* Ensure buttons display properly */
        }

        /* Added specific styling for fullscreen icon button */
        #unity-fullscreen-button {
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #unity-fullscreen-button img {
            width: 20px;
            height: 20px;
            transition: opacity 0.2s ease;
        }

        #unity-fullscreen-button:hover img {
            opacity: 0.8;
        }

        /* Unified hover effects for both buttons */
        .unity-button:hover,
        #unity-quit-button:hover {
            opacity: 0.8;
        }

        /* App name moved to toolbar center */
        #app-name {
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
            margin: 0;
        }

        /* Button containers for left and right positioning */
        .button-left, .button-right {
            min-width: 80px;
        }

        .button-left {
            text-align: left;
        }

        .button-right {
            text-align: right;
        }

        /* Video overlay */
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #video-container {
            position: relative;
            width: 90%;
            height: 90%;
            max-width: 1200px;
            max-height: 800px;
        }

        #video-frame {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        #close-video {
            position: absolute;
            top: -40px;
            right: 0;
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #close-video:hover {
            background: #da190b;
        }

        /* Loading spinner */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            #unity-container {
                margin: 10px;
            }
            
            #video-container {
                width: 95%;
                height: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- Added proper wrapper class for centering -->
    <div class="main-wrapper">
        <div id="unity-container" class="unity-desktop">
            <canvas id="unity-canvas" width="100%" height="100%" tabindex="-1"></canvas>
            <div id="unity-loading-bar">
                <div id="unity-logo"></div>
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
            <!-- Restructured controls with left, center, right layout -->
            <div id="unity-controls">
                <div class="button-left">
                    <!-- Replaced text with icon image -->
                    <button id="unity-fullscreen-button" class="unity-button">
                        <img src="TemplateData/fullscreen-button.png" alt="Fullscreen">
                    </button>
                </div>
                <div id="app-name">Gamecrit</div>
                <div class="button-right">
                    <!-- Unload button will be added here by JavaScript -->
                </div>
            </div>
            <div id="unity-warning"></div>
        </div>
    </div>

    <!-- Video overlay -->
    <div id="video-overlay">
        <div id="video-container">
            <button id="close-video" onclick="closeVideo()">✕ Close</button>
            <iframe id="video-frame" src="about:blank"></iframe>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        let unityInstance = null;

        // Video functionality
        function updateIframe(url) {
            console.log("Loading video:", url);
            
            // Convert YouTube links to embed format
            const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
            if (ytMatch) {
                const videoId = ytMatch[1];
                url = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            }

            document.getElementById("loading-overlay").style.display = 'flex';
            
            // Exit fullscreen if active
            if (unityInstance && unityInstance.SetFullscreen) {
                unityInstance.SetFullscreen(0);
            }

            const iframe = document.getElementById("video-frame");
            iframe.src = url;
            iframe.onload = () => {
                document.getElementById("loading-overlay").style.display = 'none';
                document.getElementById("video-overlay").style.display = 'flex';
            };
        }

        // Unity WebGL DLL Import functions
        function UpdateIframeURL(url) {
            // This is the function Unity calls via DllImport
            updateIframe(url);
        }

        function OpenFileDialog(objectName, callbackMethod) {
            console.log("Opening file dialog for object:", objectName, "callback:", callbackMethod);
            
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.style.display = 'none';
            
            input.onchange = function(event) {
                const file = event.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            // Convert to base64 (remove data:image/...;base64, prefix)
                            const base64Data = e.target.result.split(',')[1];
                            console.log("Image loaded, calling Unity callback:", objectName, callbackMethod);
                            
                            // Call Unity callback method on the specified GameObject
                            if (unityInstance) {
                                unityInstance.SendMessage(objectName, callbackMethod, base64Data);
                            }
                        } catch (error) {
                            console.error("Error processing image:", error);
                        } finally {
                            document.body.removeChild(input);
                        }
                    };
                    reader.onerror = function() {
                        console.error("Failed to read file");
                        document.body.removeChild(input);
                    };
                    reader.readAsDataURL(file);
                } else {
                    console.log("No valid image file selected");
                    document.body.removeChild(input);
                }
            };
            
            document.body.appendChild(input);
            input.click();
        }

        function OpenURL(url) {
            console.log("Opening URL:", url);
            window.open(url, '_blank');
        }

        // Keyboard handler state
        let keyboardState = {
            ctrlPressed: false,
            cPressed: false,
            vPressed: false,
            copyRequested: false,
            pasteRequested: false
        };

        function RegisterKeyboardHandler() {
            console.log("Registering WebGL keyboard handler");
            
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Control') {
                    keyboardState.ctrlPressed = true;
                }
                if (event.key === 'c' || event.key === 'C') {
                    keyboardState.cPressed = true;
                    if (keyboardState.ctrlPressed) {
                        keyboardState.copyRequested = true;
                    }
                }
                if (event.key === 'v' || event.key === 'V') {
                    keyboardState.vPressed = true;
                    if (keyboardState.ctrlPressed) {
                        keyboardState.pasteRequested = true;
                    }
                }
            });
            
            document.addEventListener('keyup', function(event) {
                if (event.key === 'Control') {
                    keyboardState.ctrlPressed = false;
                }
                if (event.key === 'c' || event.key === 'C') {
                    keyboardState.cPressed = false;
                }
                if (event.key === 'v' || event.key === 'V') {
                    keyboardState.vPressed = false;
                }
            });
        }

        function IsCtrlPressed() {
            return keyboardState.ctrlPressed;
        }

        function IsCPressed() {
            return keyboardState.cPressed;
        }

        function IsVPressed() {
            return keyboardState.vPressed;
        }

        function CheckAndConsumeCopyRequest() {
            const result = keyboardState.copyRequested;
            keyboardState.copyRequested = false;
            return result;
        }

        function CheckAndConsumePasteRequest() {
            const result = keyboardState.pasteRequested;
            keyboardState.pasteRequested = false;
            return result;
        }

        function closeVideo() {
            if (confirm("Are you sure you want to close the video?")) {
                const iframe = document.getElementById("video-frame");
                iframe.src = "about:blank";
                document.getElementById("video-overlay").style.display = 'none';
                document.getElementById("loading-overlay").style.display = 'none';
                iframe.onload = null;
            }
        }

        // Unity banner messages
        function unityShowBanner(msg, type) {
            const warningBanner = document.querySelector("#unity-warning");
            const div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);

            if (type === 'error') {
                div.style = 'background: red; padding: 10px; color: white; margin: 5px 0; border-radius: 4px;';
            } else if (type === 'warning') {
                div.style = 'background: orange; padding: 10px; color: white; margin: 5px 0; border-radius: 4px;';
                setTimeout(() => {
                    if (warningBanner.contains(div)) {
                        warningBanner.removeChild(div);
                    }
                }, 5000);
            }

            warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }

        // Unity configuration
        const canvas = document.querySelector("#unity-canvas");
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/GameCRIT.github.io.loader.js";

        // Enhanced WebGL context debugging and setup
        function checkAndSetupWebGL() {
            try {
                console.log('Starting WebGL context check...');
                
                // Test WebGL context creation
                const testCanvas = document.createElement('canvas');
                testCanvas.width = 300;
                testCanvas.height = 150;
                
                const contextOptions = {
                    alpha: false,
                    antialias: true,
                    depth: true,
                    failIfMajorPerformanceCaveat: false,
                    powerPreference: "default",
                    premultipliedAlpha: false,
                    preserveDrawingBuffer: false,
                    stencil: false
                };
                
                // Try WebGL 2.0 first
                let gl = testCanvas.getContext('webgl2', contextOptions);
                if (gl) {
                    console.log('WebGL 2.0 context created successfully');
                } else {
                    // Fallback to WebGL 1.0
                    gl = testCanvas.getContext('webgl', contextOptions) || testCanvas.getContext('experimental-webgl', contextOptions);
                    if (gl) {
                        console.log('WebGL 1.0 context created successfully');
                    }
                }
                
                if (!gl) {
                    throw new Error('WebGL not supported');
                }
                
                // Test basic WebGL functionality
                console.log('WebGL Version:', gl.getParameter(gl.VERSION));
                console.log('WebGL Vendor:', gl.getParameter(gl.VENDOR));
                console.log('WebGL Renderer:', gl.getParameter(gl.RENDERER));
                console.log('WebGL Shading Language Version:', gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
                
                // Test if we can create a simple shader (basic WebGL functionality test)
                const vertexShader = gl.createShader(gl.VERTEX_SHADER);
                if (!vertexShader) {
                    throw new Error('Failed to create vertex shader');
                }
                
                console.log('WebGL context is fully functional');
                return true;
            } catch (e) {
                console.error('WebGL setup failed:', e);
                return false;
            }
        }

        if (!checkAndSetupWebGL()) {
            unityShowBanner('WebGL is not supported in this browser. Please enable hardware acceleration and WebGL support.', 'error');
        } else {
            console.log('WebGL pre-check passed, proceeding with Unity initialization...');
        }

        // Pre-initialize the canvas WebGL context to prevent GLctx undefined errors
        try {
            console.log('Pre-initializing Unity canvas WebGL context...');
            const preGL = canvas.getContext('webgl2', {
                alpha: false,
                antialias: true,
                depth: true,
                stencil: false,
                preserveDrawingBuffer: false,
                premultipliedAlpha: false,
                powerPreference: "default"
            }) || canvas.getContext('webgl', {
                alpha: false,
                antialias: true,
                depth: true,
                stencil: false,
                preserveDrawingBuffer: false,
                premultipliedAlpha: false,
                powerPreference: "default"
            });
            
            if (preGL) {
                console.log('Unity canvas WebGL context pre-initialized successfully');
                // Don't do anything with it, just ensure it exists
            } else {
                console.warn('Failed to pre-initialize Unity canvas WebGL context');
            }
        } catch (e) {
            console.warn('Canvas WebGL pre-initialization failed:', e);
        }

        // Configure canvas with proper WebGL context attributes
        canvas.addEventListener('webglcontextlost', function(e) {
            console.warn('WebGL context lost');
            e.preventDefault();
            unityShowBanner('WebGL context was lost. Please refresh the page.', 'warning');
        });

        canvas.addEventListener('webglcontextrestored', function(e) {
            console.log('WebGL context restored');
            unityShowBanner('WebGL context restored.', 'warning');
        });

        const config = {
            arguments: [],
            dataUrl: buildUrl + "/GameCRIT.github.io.data.br",
            frameworkUrl: buildUrl + "/GameCRIT.github.io.framework.js.br",
            codeUrl: buildUrl + "/GameCRIT.github.io.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Gamecrit",
            productVersion: "1.0",
            showBanner: unityShowBanner,
            matchWebGLToCanvasSize: false,
            devicePixelRatio: 1,
            // WebGL context configuration
            webglContextAttributes: {
                alpha: false,
                antialias: true,
                depth: true,
                failIfMajorPerformanceCaveat: false,
                powerPreference: "default",
                premultipliedAlpha: false,
                preserveDrawingBuffer: false,
                stencil: false
            }
        };

        // Mobile detection and setup
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
        }

        // Load Unity
        document.querySelector("#unity-loading-bar").style.display = "block";

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onerror = () => {
            unityShowBanner('Failed to load Unity loader script. Please check if the build files are present.', 'error');
        };
        script.onload = () => {
            // Add additional error handling for Unity instance creation
            try {
                createUnityInstance(canvas, config, (progress) => {
                    document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
                }).then((instance) => {
                    unityInstance = instance;
                    document.querySelector("#unity-loading-bar").style.display = "none";
                    
                    // Initialize keyboard handler after Unity is loaded
                    RegisterKeyboardHandler();
                    console.log("Unity instance loaded and keyboard handler registered");

                    // Setup fullscreen button
                    const fullscreenBtn = document.querySelector("#unity-fullscreen-button");
                    if (fullscreenBtn) {
                        fullscreenBtn.onclick = () => {
                            unityInstance.SetFullscreen(1);
                        };
                    }

                    // Create and setup unload button
                    const quitBtn = document.createElement("button");
                    quitBtn.id = "unity-quit-button";
                    quitBtn.className = "unity-button";
                    quitBtn.innerHTML = "Unload";
                    quitBtn.onclick = () => {
                        if (confirm("Are you sure you want to unload the game?")) {
                            unityInstance.Quit().then(() => {
                                document.querySelector("#unity-container").remove();
                                script.remove();
                            });
                        }
                    };

                    document.querySelector("#unity-controls .button-right").appendChild(quitBtn);
                    
                }).catch((error) => {
                    console.error("Unity instance creation failed:", error);
                    unityShowBanner('Failed to create Unity instance: ' + error.message, 'error');
                    
                    // Try to provide more specific error information
                    if (error.message.includes('GLctx')) {
                        unityShowBanner('WebGL context error detected. This may be due to:<br/>1. Outdated browser<br/>2. WebGL disabled<br/>3. Hardware acceleration disabled<br/>4. Incompatible graphics drivers', 'error');
                    }
                });
                
            } catch (error) {
                console.error("Error calling createUnityInstance:", error);
                unityShowBanner('Critical error initializing Unity: ' + error.message, 'error');
            }
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
